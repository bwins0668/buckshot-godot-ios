name: Build Buckshot iOS

on:
  push:
    branches: [main, fresh-main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.1.1

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false

      - name: Verify LFS checkout
        shell: bash
        run: |
          # If scenes/main.tscn is still the LFS pointer (134 bytes), LFS failed to fetch.
          SZ=$(stat -f%z scenes/main.tscn 2>/dev/null || stat -c%s scenes/main.tscn)
          echo "scenes/main.tscn = $SZ bytes"
          if [ "$SZ" -lt 1000 ]; then
            echo "ERROR: LFS pointer not hydrated — git lfs pull needed"
            git lfs pull
            SZ=$(stat -f%z scenes/main.tscn)
            echo "after pull: $SZ bytes"
          fi

      - name: Install Godot 4.1.1
        shell: bash
        run: |
          mkdir -p ~/godot
          GODOT_DIR="$HOME/godot"
          GODOT_BIN="$GODOT_DIR/Godot.app/Contents/MacOS/Godot"
          if [ ! -x "$GODOT_BIN" ]; then
            echo "Downloading Godot 4.1.1 stable (macOS universal)"
            curl -L -o "$GODOT_DIR/godot.zip" "https://github.com/godotengine/godot/releases/download/4.1.1-stable/Godot_v4.1.1-stable_macos.universal.zip"
            cd "$GODOT_DIR"
            unzip -o godot.zip
            rm godot.zip
            chmod +x Godot.app/Contents/MacOS/Godot
            xattr -dr com.apple.quarantine Godot.app 2>/dev/null || true
          fi
          echo "GODOT_PATH=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install iOS export templates
        shell: bash
        run: |
          TEMPLATES="$HOME/Library/Application Support/Godot/export_templates/$GODOT_VERSION.stable"
          if [ ! -d "$TEMPLATES" ]; then
            echo "Downloading iOS export templates"
            rm -rf /tmp/godot_tpl
            mkdir -p /tmp/godot_tpl
            curl -L -o "/tmp/godot_tpl/templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            cd /tmp/godot_tpl
            unzip -q -o templates.tpz
            ls templates/ | head
            mkdir -p "$TEMPLATES"
            cp -r templates/* "$TEMPLATES/"
          fi
          ls "$TEMPLATES" | head -5

      - name: Skip --import (cache already valid)
        shell: bash
        run: |
          # CRITICAL: All .glb files are 660-byte empty stubs. Real geometry lives in
          # .godot/imported/*.scn cache which we ship in the repo. Godot's --import
          # would re-import the empty stubs and DESTROY the cache. Do NOT run --import.
          SCN_COUNT=$(find .godot/imported -name "*.scn" 2>/dev/null | wc -l | tr -d ' ')
          CTEX_COUNT=$(find .godot/imported -name "*.ctex" 2>/dev/null | wc -l | tr -d ' ')
          echo "Cache: $SCN_COUNT .scn (mesh) + $CTEX_COUNT .ctex (textures)"
          if [ "$SCN_COUNT" -lt 100 ] || [ "$CTEX_COUNT" -lt 500 ]; then
            echo "ERROR: cache looks incomplete — LFS pull likely failed"
            exit 1
          fi

      - name: Sanity-check critical mesh cache
        shell: bash
        run: |
          for glb in "shotgun with hands2.glb" "tabletop export6.glb" "dealer head rigged1.glb" "dealer hands main1.glb" "shotgun shells export1.glb"; do
            stem=$(echo "$glb" | sed 's/\.glb$//')
            scn=$(find .godot/imported -name "${stem}*.scn" 2>/dev/null | head -1)
            if [ -z "$scn" ]; then
              echo "MISSING mesh cache for $glb"
              exit 1
            fi
            sz=$(stat -f%z "$scn" 2>/dev/null || stat -c%s "$scn")
            echo "$glb → $scn ($sz bytes)"
          done

      - name: Export iOS Xcode project
        shell: bash
        run: |
          mkdir -p builds
          "$GODOT_PATH" --headless --path . --export-release "iOS" builds/buckshot.xcodeproj 2>&1 | tail -50
          ls -la builds/

      - name: Repair pbxproj indentation
        shell: bash
        run: |
          # Godot 4.1.1 iOS export bug: PBXFileReference entries for InfoPlist
          # .lproj files are emitted without leading tabs, breaking Xcode's
          # plist parser. Repair the indentation before xcodebuild runs.
          if [ -f builds/buckshot.xcodeproj/project.pbxproj ]; then
            python3 ci/repair_pbxproj.py builds/buckshot.xcodeproj/project.pbxproj
          fi

      - name: Install provisioning profile
        shell: bash
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$IOS_PROVISION_PROFILE_BASE64" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          fi

      - name: Import signing certificate
        shell: bash
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          if [ -n "$IOS_P12_BASE64" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            echo "$IOS_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
            file_size=$(stat -f%z "$RUNNER_TEMP/cert.p12")
            echo "Decoded p12 size: $file_size bytes"
            OPENSSL_BIN="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
            [ ! -x "$OPENSSL_BIN" ] && OPENSSL_BIN="$(command -v openssl)"
            echo "Using openssl: $("$OPENSSL_BIN" version)"
            # Verify password works:
            "$OPENSSL_BIN" pkcs12 -in "$RUNNER_TEMP/cert.p12" \
              -passin "pass:$IOS_P12_PASSWORD" -nokeys -clcerts 2>&1 | grep -E "subject=|MAC verification" || true
            # Convert keychain Data Protection key to legacy "Apple-specific" with openssl,
            # then import (security CLI on recent macOS can't read PBES2 packaged by xcode).
            "$OPENSSL_BIN" pkcs12 -in "$RUNNER_TEMP/cert.p12" \
              -passin "pass:$IOS_P12_PASSWORD" \
              -passout "pass:$IOS_P12_PASSWORD" \
              -export -legacy -descert \
              -out "$RUNNER_TEMP/cert.legacy.p12" 2>&1 || {
              echo "openssl re-export failed, trying without -descert"
              "$OPENSSL_BIN" pkcs12 -in "$RUNNER_TEMP/cert.p12" \
                -passin "pass:$IOS_P12_PASSWORD" \
                -passout "pass:$IOS_P12_PASSWORD" \
                -export -legacy \
                -out "$RUNNER_TEMP/cert.legacy.p12"
            }
            file_size2=$(stat -f%z "$RUNNER_TEMP/cert.legacy.p12")
            echo "Legacy p12 size: $file_size2 bytes"
            security import "$RUNNER_TEMP/cert.legacy.p12" \
              -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 \
              -k "$KEYCHAIN_PATH" 2>&1
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          fi

      - name: Build & sign .ipa
        shell: bash
        run: |
          cd builds
          PROJECT="buckshot.xcodeproj"
          if [ -n "$IOS_P12_BASE64" ]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | sed -n 's/.*"\(.*\)".*/\1/p')
            xcodebuild \
              -project "$PROJECT" \
              -scheme "buckshot" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$RUNNER_TEMP/Buckshot.xcarchive" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="$IDENTITY" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              archive 2>&1 | tail -40
            # Use the repo-shipped ExportOptions.plist (avoids YAML-heredoc gotchas).
            cp ci/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
            xcodebuild \
              -exportArchive \
              -archivePath "$RUNNER_TEMP/Buckshot.xcarchive" \
              -exportPath "$RUNNER_TEMP/ipa_out" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" 2>&1 | tail -20
          else
            xcodebuild \
              -project "$PROJECT" \
              -scheme "buckshot" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              -derivedDataPath "$RUNNER_TEMP/derived" \
              build 2>&1 | tail -40
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buckshot-ios
          path: |
            ${{ runner.temp }}/Buckshot.xcarchive
            ${{ runner.temp }}/ipa_out/*.ipa
            builds/
          if-no-files-found: warn